# =============================================
# DEV PROFILE — Local development
# Activate with: --spring.profiles.active=dev
#   or set SPRING_PROFILES_ACTIVE=dev
# =============================================

# --- Database ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:Ecommerce}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# --- JWT Secret ---
jwt.secret=${JWT_SECRET:dev-secret-change-me-in-env}

# --- Cloudinary ---
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api_key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:your_api_secret}

# --- Mail ---
spring.mail.username=${MAIL_USERNAME:dev@example.com}
spring.mail.password=${MAIL_PASSWORD:dev-mail-password}

# --- Frontend CORS origin ---
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- Python AI service ---
python.service.url=${PYTHON_API_URL:http://localhost:8000}

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- HikariCP connection pool ---
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
