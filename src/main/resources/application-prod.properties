# =============================================
# PROD PROFILE — Production deployment
# Activate with: --spring.profiles.active=prod
#   or set SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST be set via env vars
# =============================================

# --- Database (production MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# --- JWT Secret ---
jwt.secret=${JWT_SECRET}

# --- Cloudinary ---
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# --- Mail ---
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# --- Frontend CORS origin ---
app.frontend.url=${FRONTEND_URL}

# --- Python AI service ---
python.service.url=${PYTHON_API_URL}

# --- Redis ---
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true

# --- HikariCP connection pool  ---
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=270000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000

# --- Logging  ---
logging.level.root=INFO
logging.level.org.springframework.web=INFO

# --- Swagger / OpenAPI ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Server ---
server.port=${PORT:8080}
