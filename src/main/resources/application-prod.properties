# =============================================
# PROD PROFILE — Production deployment
# Activate with: --spring.profiles.active=prod
#   or set SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST be set via env vars
# =============================================

# --- Database (production MySQL) ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# --- JWT Secret ---
jwt.secret=${JWT_SECRET}
jwt.access.expiration_time=30
jwt.refresh.expiration_time=4320

# --- Cloudinary ---
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# --- Mail ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# --- Frontend CORS origin ---
app.frontend.url=${FRONTEND_URL}

# --- Python AI service ---
python.service.url=${PYTHON_API_URL}

# --- Redis ---
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true

# --- HikariCP connection pool (tuned for production) ---
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- Logging (minimal for production) ---
logging.level.root=INFO
logging.level.org.springframework.web=INFO

# --- Swagger / OpenAPI (disabled in prod for security) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Server ---
server.port=${PORT:8080}
