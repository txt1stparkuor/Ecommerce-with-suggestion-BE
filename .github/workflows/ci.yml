name: CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    # ── Services ──────────────────────────────────────────────────────────────
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: Ecommerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # ── Steps ─────────────────────────────────────────────────────────────────
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Build only — skip tests here; the next step runs them with services up
      - name: Compile (verify dependencies resolve)
        run: ./mvnw compile -B -q
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: Ecommerce
          DB_USER: root
          DB_PASSWORD: root
          JWT_SECRET: ci-dummy-secret-at-least-32-chars-long
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: "000000000000000"
          CLOUDINARY_API_SECRET: dummy_secret
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: dummy-mail-password
          FRONTEND_URL: http://localhost:5173
          PYTHON_API_URL: http://localhost:8000
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Run the full test suite (Spring context loads against the real services)
      - name: Run tests
        run: ./mvnw test -B
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: Ecommerce
          DB_USER: root
          DB_PASSWORD: root
          JWT_SECRET: ci-dummy-secret-at-least-32-chars-long
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: "000000000000000"
          CLOUDINARY_API_SECRET: dummy_secret
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: dummy-mail-password
          FRONTEND_URL: http://localhost:5173
          PYTHON_API_URL: http://localhost:8000
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Package the JAR to confirm nothing is broken at the packaging stage
      - name: Package JAR (skip tests — already ran above)
        run: ./mvnw package -B -DskipTests -q
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: Ecommerce
          DB_USER: root
          DB_PASSWORD: root
          JWT_SECRET: ci-dummy-secret-at-least-32-chars-long
          CLOUDINARY_CLOUD_NAME: dummy
          CLOUDINARY_API_KEY: "000000000000000"
          CLOUDINARY_API_SECRET: dummy_secret
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: dummy-mail-password
          FRONTEND_URL: http://localhost:5173
          PYTHON_API_URL: http://localhost:8000
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7
